<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Flow: Ledger | Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #FAF7F2;
      --surface:     #F2EDE4;
      --text:        #2A2622;
      --text-muted:  #6B645C;
      --border:      #E2DACC;
      --accent:      #7A9B7E;
      --accent-dark: #5A7B5E;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 24px;
      text-align: center;
    }

    .wordmark {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-dark);
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 700;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 20px;
    }

    .desc {
      font-size: 17px;
      color: var(--text-muted);
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .badge {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 12px 20px;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 48px;
    }

    .badge strong {
      color: var(--accent-dark);
      font-weight: 700;
    }

    .home-link {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent-dark);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: opacity 0.2s;
    }

    .home-link:hover { opacity: 0.7; }

    .footer {
      position: fixed;
      bottom: 24px;
      font-size: 12px;
      color: var(--border);
    }
  </style>
</head>
<body>

  <p class="wordmark">Pure Flow: Ledger</p>

  <h1>Personal finance that minds<br>its own business.</h1>

  <p class="desc">Track spending, set budgets, manage multiple accounts and currencies. All on your device. No account. No subscription. No cloud.</p>

  <div class="badge"><strong>In testing.</strong> Launching on Google Play soon.</div>

  <a href="/" class="home-link">← back to pureflowapps.com</a>

  <p class="footer">&copy; 2026 Orokin Systems Inc.</p>

</body>
</html>
